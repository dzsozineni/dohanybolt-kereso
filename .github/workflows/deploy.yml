name: Frissítés és közzététel

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"     # naponta 06:17 magyar idő szerint (nyáron)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Adatbázis frissítése a szerverről
        run: python3 tools/update_from_server.py || echo "::warning::A szerver nem elérhető, a meglévő adat marad."

      - name: Új adat mentése a repóba
        run: |
          if git diff --quiet data/; then
            echo "Nincs új adat."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Adatbázis frissítve"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
